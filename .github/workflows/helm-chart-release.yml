name: Release Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release chart repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# imperva-exporter Helm charts" > README.md
            git add README.md
            git commit -m "Initialize gh-pages"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Release Helm chart
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-oci:
    name: Publish OCI chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Read chart version
        id: chart
        run: |
          version=$(awk '/^version:/ { print $2; exit }' charts/imperva-exporter/Chart.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check OCI chart version
        id: oci
        continue-on-error: true
        run: helm show chart oci://ghcr.io/${{ github.repository_owner }}/charts/imperva-exporter --version "${{ steps.chart.outputs.version }}"

      - name: Package Helm chart
        if: steps.oci.outcome == 'failure'
        run: helm package charts/imperva-exporter --destination .cr-release-packages

      - name: Push Helm chart to GHCR
        if: steps.oci.outcome == 'failure'
        run: helm push .cr-release-packages/imperva-exporter-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Skip existing OCI chart
        if: steps.oci.outcome == 'success'
        run: echo "OCI chart imperva-exporter:${{ steps.chart.outputs.version }} already exists; skipping push."
